{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Connexion</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap');

      :root {
        --primary-color: #2e7d32;
        --secondary-color: #f5f5f5;
        --input-border: #ccc;
        --btn-color: #003366;
        --btn-hover-color: #001f4d;
        --btn-text: #ffffff;
        --error-color: #d32f2f;
        --font-family: 'Poppins', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-family);
        background: linear-gradient(135deg, #e3f2fd, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #333;
      }

      .wrapper {
        background-color: var(--secondary-color);
        padding: 45px 40px 50px;
        border-radius: 20px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        position: relative;
        transition: box-shadow 0.3s ease;
      }

      .wrapper:hover {
        box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      }

      .form-header {
        position: absolute;
        top: 20px;
        right: 20px;
      }

      .form-header-link {
        background: var(--primary-color);
        color: white;
        padding: 9px 22px;
        border-radius: 30px;
        font-weight: 600;
        text-decoration: none;
        font-size: 14px;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        user-select: none;
      }

      .form-header-link:hover,
      .form-header-link:focus {
        background-color: #1b5e20;
        box-shadow: 0 6px 18px rgba(27, 94, 32, 0.6);
      }

      .form-title {
        text-align: center;
        margin-bottom: 40px;
        font-size: 32px;
        color: var(--primary-color);
        font-weight: 700;
        letter-spacing: 1px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .input-box {
        display: flex;
        flex-direction: column;
      }

      .input-box input {
        padding: 14px 18px;
        font-size: 16px;
        border: 1.8px solid var(--input-border);
        border-radius: 10px;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        font-family: var(--font-family);
      }

      .input-box input::placeholder {
        color: #999;
        font-weight: 300;
      }

      .input-box input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 8px rgba(46, 125, 50, 0.35);
      }

      .error-message {
        margin-top: 6px;
        color: var(--error-color);
        font-size: 13px;
        font-weight: 600;
        user-select: none;
      }

      #messages p {
        background: #fbe9e7;
        color: var(--error-color);
        padding: 10px 15px;
        border-radius: 8px;
        font-weight: 600;
        margin-bottom: 18px;
        box-shadow: 0 1px 6px rgba(211, 47, 47, 0.3);
      }

      .btn-submit {
        padding: 14px 0;
        background-color: var(--btn-color);
        color: var(--btn-text);
        border: none;
        border-radius: 30px;
        font-weight: 700;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        width: 100%;
        user-select: none;
        box-shadow: 0 6px 14px rgba(0, 51, 102, 0.35);
      }

      .btn-submit:hover,
      .btn-submit:focus {
        background-color: var(--btn-hover-color);
        box-shadow: 0 8px 20px rgba(0, 31, 77, 0.6);
      }

      .switch-form {
        text-align: center;
        margin-top: 28px;
        font-size: 15px;
        color: #555;
        user-select: none;
      }

      .switch-form a {
        color: var(--primary-color);
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .switch-form a:hover,
      .switch-form a:focus {
        text-decoration: underline;
        color: #1b5e20;
      }

      @media (max-width: 480px) {
        .wrapper {
          padding: 35px 25px 40px;
          max-width: 100%;
          border-radius: 15px;
          margin: 15px;
        }

        .form-title {
          font-size: 26px;
          margin-bottom: 30px;
        }
      }
    </style>
</head>
<body>
  <div class="wrapper">

    <h1 class="form-title">Connexion</h1>

    {% if messages %}
      <div id="messages">
        {% for message in messages %}
          <p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="input-box">
        <input type="email" name="username" class="form-control" maxlength="254" required id="id_username" placeholder="Email">
      </div>

      <div class="input-box">
        <input type="password" name="password" class="form-control" required id="id_password" placeholder="Mot de passe">
      </div>

      <button type="submit" class="btn-submit" aria-label="Se connecter">Se connecter</button>
    </form>

    <div class="switch-form" role="contentinfo">
      <p>Pas encore de compte ? <a href="/register/">Inscrivez-vous ici</a></p>
    </div>
  </div>
</body>
</html>
