{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <!-- <link rel="stylesheet" href="/static/css/register.css"> -->
</head>
<body>
<style>
    :root {
      --primary-color: #2e7d32;
      --secondary-color: #f5f5f5;
      --input-border: #ccc;
      --btn-color: #003366;
      --btn-text: #ffffff;
      --error-color: #d32f2f;
    }

    body {
      background-color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .form-wrapper {
      background: var(--secondary-color);
      padding: 40px;
      border-radius: 15px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .form-header {
      position: absolute;
      top: -40px;
      right: 20px;
    }

    .form-header-link {
      background: var(--primary-color);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }

    .form-header-link:hover {
      background-color: #1b5e20;
    }

    .form-title {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      color: var(--primary-color);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 12px 16px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.2);
    }

    .error-message {
      color: var(--error-color);
      font-size: 13px;
      margin-top: 5px;
    }

    .message {
      background: #e8f5e9;
      color: var(--primary-color);
      padding: 10px;
      border-left: 4px solid var(--primary-color);
      margin-bottom: 15px;
    }

    .form-footer {
      grid-column: span 2;
      text-align: center;
      margin-top: 20px;
    }

    .btn-submit {
      padding: 12px 25px;
      background-color: var(--btn-color);
      color: var(--btn-text);
      border: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #001f4d;
    }

    .switch-form {
      margin-top: 15px;
      font-size: 14px;
    }

    .switch-form a {
      color: var(--primary-color);
      font-weight: bold;
      text-decoration: none;
    }

    .switch-form a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-header {
        top: 10px;
        right: 10px;
      }
    }
</style>

<div class="form-wrapper">
    <div class="form-header">
        <a href="/login/" class="form-header-link">Se connecter</a>
    </div>

    <h2 class="form-title">Créer un compte</h2>

    <form method="post" enctype="multipart/form-data" class="form-grid">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_email">Email:</label>
            <input type="email" name="email" maxlength="254" required id="id_email">
        </div>

        <div class="form-group">
            <label for="id_password">Mot de passe:</label>
            <input type="password" name="password" required id="id_password">
        </div>

        <div class="form-group">
            <label for="id_profile_photo">Photo de profil:</label>
            <input type="file" name="profile_photo" accept="image/*" id="id_profile_photo">
        </div>

        <div class="form-group">
            <label for="id_user_type">Type d'utilisateur:</label>
            <select name="user_type" id="id_user_type">
              <option value="freelancer">Freelancer</option>
              <option value="client">Client</option>
            </select>
        </div>

        <div class="form-group">
            <label for="id_skills">Compétences:</label>
            <textarea name="skills" id="id_skills" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label for="id_experience">Expérience:</label>
            <textarea name="experience" id="id_experience" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label for="id_portfolio_url">Lien du portfolio:</label>
            <input type="url" name="portfolio_url" id="id_portfolio_url">
        </div>

        <div class="form-group">
            <label for="id_cv_file">Fichier CV:</label>
            <input type="file" name="cv_file" id="id_cv_file">
        </div>

        <div class="form-group">
            <label for="id_location">Localisation:</label>
            <input type="text" name="location" id="id_location">
        </div>

        <div class="form-group">
            <label for="id_company_name">Nom de l'entreprise:</label>
            <input type="text" name="company_name" id="id_company_name">
        </div>

        <div class="form-group">
            <label for="id_description">Description:</label>
            <textarea name="description" id="id_description" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label for="id_website">Site web:</label>
            <input type="url" name="website" id="id_website">
        </div>

        <div class="form-footer">
            <button type="submit" class="btn-submit">S'inscrire</button>
            <p class="switch-form">Déjà un compte ? <a href="/login/">Connectez-vous</a></p>
        </div>
    </form>
</div>
</body>
</html>
